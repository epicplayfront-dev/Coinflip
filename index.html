<!DOCTYPE html>
<html lang="en">
<head>
    <title>Coin flip game</title>
    <meta name="viewport" content="width=device-width, inital-scale=1.0">
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="main container">
        <h1 class="font-heading">Flip the coin</h1>
        <h4 class="font-subheading">Press the coin or the button to flip the coin</h4>
        <div class="container coin">
            <img class="coin-img" id="coin" onclick="flipCoin()" src="assets/heads.svg">
            <img class="shadow" src="assets/shadow.svg">
        </div>
        <p class="font-subheading" id="result">Heads</p>
        <button onclick="flipCoin()" class="font-button-text">Flip coin</button>
    </div>
</body>
</html>
